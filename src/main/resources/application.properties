spring.application.name=WAGWAG

spring.datasource.url=jdbc:postgresql://localhost:5432/wagwag
spring.datasource.username=cho
spring.datasource.password=@101023
spring.jpa.hibernate.ddl-auto=update

# File Upload Settings
spring.servlet.multipart.max-file-size=100MB
